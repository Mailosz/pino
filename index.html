<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>hello-wasm example</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
      }

      #main-canvas {
        width: 100%;
        height: 100%
      }
    </style>
  </head>
  <body>
    <canvas id="main-canvas"></canvas>
    <script type="module">
      import init, * as pino from "./pkg/pino.js";
      import {CanvasManager, DrawingManager, InputManager} from "./js/www/js/canvas/main.js";
      import {ScrollManipulation} from "./js/www/js/canvas/InputManager.js";


      class WebGlDrawingManager extends DrawingManager {


        constructor() {
          super();
          this.realViewport = null;
          this.viewportDelta = null;
          this.animationFrameHandle = null;
          this.animationTimeLeft = 0;
          this.lastAnimationTime = null;
        }

        resize(width, height) {
          pino.resize(this.cm.canvasElement.id, width, height);
          pino.redraw(this.cm.canvasElement.id);

        }

        /**
         * Called automatically before first draw
         */
        prepare() {
          pino.initialize(this.cm.canvasElement.id);
        }

        showViewport() {
          // console.log(this.realViewport);
          pino.animate_viewport(
            this.cm.canvasElement.id, 
            this.realViewport?.x ?? this.cm.viewport.x, 
            this.realViewport?.y ?? this.cm.viewport.y, 
            this.realViewport?.w ?? this.cm.viewport.w, 
            this.realViewport?.h ?? this.cm.viewport.h
          );
        }

        resetRealViewport() {
          this.realViewport.x = this.cm.viewport.x;
            this.realViewport.y = this.cm.viewport.y;
            this.realViewport.w = this.cm.viewport.w;
            this.realViewport.h = this.cm.viewport.h;
            this.showViewport();
        }

        animateViewport() {
          this.animationFrameHandle = requestAnimationFrame((time) => {
            let elapsed;
            if (this.lastAnimationTime != null) {
                elapsed = time - this.lastAnimationTime;
                this.lastAnimationTime = time;
            } else {
                elapsed = document.timeline.currentTime - time;
                this.lastAnimationTime = document.timeline.currentTime;
            }
            const percentage = elapsed / this.animationTimeLeft;
            

            this.animationTimeLeft -= elapsed;
            

            if (this.animationTimeLeft <= 0) {
              this.resetRealViewport();
            } else {

              const viewportDelta = {
                x: this.cm.viewport.x - this.realViewport.x, 
                y: this.cm.viewport.y - this.realViewport.y, 
                w: this.cm.viewport.w - this.realViewport.w, 
                h: this.cm.viewport.h - this.realViewport.h
              };

              this.realViewport.x += viewportDelta.x * percentage;
              this.realViewport.y += viewportDelta.y * percentage;
              this.realViewport.w += viewportDelta.w * percentage;
              this.realViewport.h += viewportDelta.h * percentage;

              this.showViewport();
              
              this.animateViewport();
            }
          });
        }

        updateViewport(viewport) {

          if (this.realViewport != null) {
            if (this.animationTimeLeft <= 0) {
              if (Math.abs(this.cm.viewport.w - this.realViewport.w) > Number.EPSILON) {
                this.animationTimeLeft = 200;
                this.lastAnimationTime = document.timeline.currentTime;

                if (this.animationFrameHandle === null) {
                  cancelAnimationFrame(this.animationFrameHandle);
                }
                

                this.animateViewport();
              }
              else {
                this.resetRealViewport();
              }

            } else {
              if (Math.abs(this.cm.viewport.w - this.realViewport.w) > Number.EPSILON) {
                this.animationTimeLeft = 200;
              }
              else {
                this.resetRealViewport();
              }
              
            }
          } else {
            this.realViewport = {x: this.cm.viewport.x, y: this.cm.viewport.y, w: this.cm.viewport.w, h: this.cm.viewport.h};
          }

            const zoomX = this.cm.width / viewport.w;
            const zoomY = this.cm.height / viewport.h;
          
            // pino.set_transform(this.cm.canvasElement.id, 
            //   zoomX, 0, -viewport.x * zoomX,
            //   0, zoomY, -viewport.y * zoomY,
            //   0, 0, 1,
            // )
            
            
            this.redraw();
        }


        redraw(rect) {
          pino.redraw(this.cm.canvasElement.id, this.cm.viewport.x, this.cm.viewport.y, this.cm.viewport.w, this.cm.viewport.h);
          this.showViewport();
        }
      }

      class ScrollInputManager extends InputManager {
        constructor() {
          super();
          this.interaction = null;
          /** @type {CanvasManager} */
          this.cm = null;
      }


      /**
       * Single click action (pointer pressed and quickly released without moving)
       * @param {PointerData} pointer 
       */
      click(pointer) {
          if (pointer.consecutiveClickCount == 0) {
              this.cm.redraw();
          } else {
              this.cm.redraw();
          }

      }

      /**
       * Alternative click action (e.g. right mouse button)
       * @param {PointerData} pointer 
       */
      alternativeClick(pointer) {
          this.cm.redraw();
      }

      /**
       * Pointer moved over canvas without contact (e.g. mouse hover)
       * @param {PointerData} data 
       */;
      hover(pointer) {
          // this.cm.drawing.mouse = {x: pointer.x, y: pointer.y};
          // this.cm.redraw();
      }

      /**
       * Pointer pressed and moved - manipulation starts
       * @param {PointerData} pointer 
       * @returns {Manipulation} A manipulation object that manages further inputs or null.
       */
      beginManipulation(pointer) {
          if (pointer.button == 1) {
              return new ScrollManipulation(this.cm, pointer);
          }

      }
      }

      init().then(() => {
        let canvas = document.getElementById('main-canvas');
        console.log(canvas.id);
        let cm = new CanvasManager(canvas);
        cm.setDrawingManager(new WebGlDrawingManager());
        cm.setInputManager(new ScrollInputManager());
        


        pino.set_linear_gradient(canvas.id, 520, 500, 850, 900, [
          0,   1, 0, 0, 1, 
          0.5, 0, 1, 0, 1,
          1,   0, 0, 1, 1
        ]);

        // set_solid_color_brush(canvas.id, 1, 1, 0, 1);


//         add_polygon(canvas.id, "counter-clockwise", [
//           400, 400,
//           400, 500,
//           600, 400,
//           600, 500,

// ]);

          pino.add_polygon(canvas.id, "clockwise", [
                      500, 500,
                      1000, 500,
                      900, 300,
                      800, 700,
                      700, 300,
                      600, 700,

            ]);


            pino.set_conic_gradient(canvas.id, 300, 300, 600, 500, [
          0,   1, 1, 0, 1, 
          0.5, 0, 1, 1, 1,
          1,   1, 0, 1, 1
        ]);

        pino.add_polygon(canvas.id, "clockwise", [
                      200, 200,
                      500, 200,
                      500, 500,
                      200, 500,

            ]);


          var image = new Image();
          image.src = "img/alert.png";
          image.addEventListener('load', function() {
            // Now that the image has loaded make copy it to the texture.
            pino.set_image_brush(canvas.id, image);

            pino.add_polygon(canvas.id, "clockwise", [
              800, 800,
              1200, 800,
              1200, 1200,
              800, 1200
            ]);

            cm.redraw();
          }); 

//         add_polygon(canvas.id, "counter-clockwise", [
//           800, 100,
//           800, 200,
//           900, 200,
//           900, 300,
//           1000, 300,
//           1000, 200,
//           900, 200,
//           900, 100,
// ]);

        // add_polygon(canvas.id, [
        //   400, 400,
        //   350, 450,
        //   400, 500, 
        //   500, 500, 
        //   550, 450, 
        //   500, 400, 
        //   600, 300, 
        //   600, 400,
        //   800, 250,
        //   550, 250]);        
        
        
        // add_polygon(canvas.id, "counter-clockwise", [
        //   400, 400,
        //   350, 450,
        //   400, 500, 
        //   500, 500, 
        //   550, 450, 
        //   500, 400, 
        //   600, 300, 
        //   600, 400,
        //   800, 250,
        //   550, 250]);

        let vertices = [];
        let max = 80;
        let size = 100;
        let cx = 500;
        let cy = 500;
        for (let i = 0; i < max; i++) {
          let angle = (i / max) * Math.PI * 2;
            vertices.push(cx + Math.cos(angle) * size);
            vertices.push(cy + Math.sin(angle) * size);
        }
        pino.add_polygon(canvas.id, "clockwise", vertices);
          

        pino.set_transform(canvas.id, 
          1, 0, 0,
          0, 1, 0,
          0, 0, 1,
        )
        
        cm.redraw();
      });
    </script>
  </body>
</html>
